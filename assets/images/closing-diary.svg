<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="closeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0F5"/>
      <stop offset="100%" stop-color="#FCE4EC"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#closeBg)"/>
  <!-- Closed Book with gold ribbon -->
  <g transform="translate(180, 100)">
    <rect width="240" height="180" rx="10" fill="#880E4F"/>
    <rect x="5" y="5" width="225" height="170" rx="8" fill="#AD1457"/>
    <!-- Gold embossing -->
    <rect x="25" y="25" width="185" height="130" rx="4" fill="none" stroke="#FFE082" stroke-width="2"/>
    <text x="117" y="85" font-family="'Playfair Display', serif" font-size="16" fill="#FFE082" font-weight="600" text-anchor="middle">Vacation Diary</text>
    <text x="117" y="110" font-family="'Caveat', cursive, sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle">Dashain &amp; Tihar</text>
    <!-- Ribbon Bookmark -->
    <path d="M110 0 L110 195 L117 185 L124 195 L124 0 Z" fill="#FFE082"/>
  </g>
  <!-- Fallen Sakura petals -->
  <circle cx="160" cy="290" r="12" fill="#F8BBD0"/>
  <circle cx="430" cy="270" r="10" fill="#F48FB1"/>
</svg>