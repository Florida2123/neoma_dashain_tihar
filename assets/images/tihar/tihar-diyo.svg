<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <radialGradient id="flameGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE082" stop-opacity="1"/>
      <stop offset="40%" stop-color="#FF9800" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#E65100" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nightBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D1525"/>
      <stop offset="50%" stop-color="#4A152C"/>
      <stop offset="100%" stop-color="#1E0E1B"/>
    </linearGradient>
  </defs>
  <rect width="600" height="450" fill="url(#nightBg)"/>
  
  <!-- Ambient Diyo glow -->
  <circle cx="300" cy="210" r="140" fill="url(#flameGlow)"/>
  
  <!-- Marigold flower bed surrounding diyo -->
  <g transform="translate(300, 260)">
    <circle cx="-110" cy="0" r="22" fill="#FFB300"/>
    <circle cx="-75" cy="20" r="24" fill="#FF8F00"/>
    <circle cx="-30" cy="30" r="25" fill="#FFC107"/>
    <circle cx="30" cy="30" r="25" fill="#FFB300"/>
    <circle cx="75" cy="20" r="24" fill="#FF8F00"/>
    <circle cx="110" cy="0" r="22" fill="#FFC107"/>
  </g>
  
  <!-- Terracotta Clay Diyo -->
  <ellipse cx="300" cy="260" rx="90" ry="38" fill="#8D6E63"/>
  <ellipse cx="300" cy="254" rx="78" ry="30" fill="#5D4037"/>
  <ellipse cx="300" cy="254" rx="65" ry="24" fill="#3E2723"/>
  
  <!-- Diyo Flame -->
  <path d="M300 245 Q275 200 300 135 Q325 200 300 245 Z" fill="#FFB300"/>
  <path d="M300 242 Q285 205 300 155 Q315 205 300 242 Z" fill="#FFF9C4"/>
  <circle cx="300" cy="190" r="10" fill="#FFFFFF"/>
  
  <!-- Twinkling stars / fairy lights -->
  <circle cx="100" cy="80" r="3" fill="#FFE082"/>
  <circle cx="180" cy="120" r="2.5" fill="#FFD54F"/>
  <circle cx="450" cy="90" r="3" fill="#FFE082"/>
  <circle cx="520" cy="140" r="2" fill="#FFD54F"/>
  <circle cx="230" cy="60" r="2" fill="#FFE082"/>
  <circle cx="380" cy="70" r="2.5" fill="#FFF9C4"/>
  
  <text x="300" y="390" font-family="'Playfair Display', serif" font-size="22" fill="#FFE082" font-weight="700" text-anchor="middle">Golden Diyo Light</text>
  <text x="300" y="415" font-family="'Caveat', cursive, sans-serif" font-size="18" fill="#F8BBD0" text-anchor="middle">Illuminating every corner of our home</text>
</svg>