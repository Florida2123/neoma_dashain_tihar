<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="btBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3E0"/>
      <stop offset="100%" stop-color="#FCE4EC"/>
    </linearGradient>
  </defs>
  <rect width="600" height="450" fill="url(#btBg)"/>
  
  <!-- Makhamali & Sayapatri Garlands -->
  <g transform="translate(300, 160)">
    <!-- Garland Loop -->
    <path d="M-150 0 C-150 160 150 160 150 0" fill="none" stroke="#7B1FA2" stroke-width="26" stroke-linecap="round"/>
    <path d="M-130 -10 C-130 140 130 140 130 -10" fill="none" stroke="#FFA000" stroke-width="24" stroke-linecap="round"/>
  </g>
  
  <!-- Saptarangi 7 colors Tika stripe decorative plate -->
  <g transform="translate(300, 230)">
    <rect x="-90" y="-30" width="180" height="60" rx="30" fill="#FFFFFF" filter="drop-shadow(0 4px 10px rgba(0,0,0,0.1))"/>
    <!-- 7 Rainbow color dots -->
    <circle cx="-60" cy="0" r="10" fill="#D32F2F"/>
    <circle cx="-40" cy="0" r="10" fill="#F57C00"/>
    <circle cx="-20" cy="0" r="10" fill="#FBC02D"/>
    <circle cx="0" cy="0" r="10" fill="#388E3C"/>
    <circle cx="20" cy="0" r="10" fill="#1976D2"/>
    <circle cx="40" cy="0" r="10" fill="#7B1FA2"/>
    <circle cx="60" cy="0" r="10" fill="#E91E63"/>
  </g>
  
  <text x="300" y="390" font-family="'Playfair Display', serif" font-size="22" fill="#880E4F" font-weight="700" text-anchor="middle">Seven-Colored Saptarangi Tika</text>
  <text x="300" y="415" font-family="'Caveat', cursive, sans-serif" font-size="18" fill="#AD1457" text-anchor="middle">Sibling love, blessings &amp; Makhamali garlands</text>
</svg>