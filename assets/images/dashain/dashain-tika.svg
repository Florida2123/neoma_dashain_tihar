<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="dtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5F7"/>
      <stop offset="100%" stop-color="#FED7E2"/>
    </linearGradient>
    <linearGradient id="thali" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="50%" stop-color="#FFCA28"/>
      <stop offset="100%" stop-color="#FFB300"/>
    </linearGradient>
  </defs>
  <rect width="600" height="450" fill="url(#dtGrad)"/>
  <circle cx="300" cy="220" r="170" fill="#FFFFFF" fill-opacity="0.6"/>
  <!-- Brass Pooja Plate -->
  <ellipse cx="300" cy="250" rx="190" ry="90" fill="url(#thali)"/>
  <ellipse cx="300" cy="245" rx="175" ry="80" fill="#FFF8E1"/>
  <ellipse cx="300" cy="245" rx="160" ry="70" fill="none" stroke="#FFB300" stroke-width="2" stroke-dasharray="6,4"/>
  <!-- Red Akshata / Tika bowl -->
  <ellipse cx="230" cy="240" rx="45" ry="25" fill="#B71C1C"/>
  <ellipse cx="230" cy="235" rx="42" ry="22" fill="#E53935"/>
  <circle cx="225" cy="230" r="4" fill="#FFFFFF"/>
  <circle cx="238" cy="235" r="3" fill="#FFFFFF"/>
  <circle cx="218" cy="238" r="3" fill="#FFFFFF"/>
  <!-- Golden Jamara -->
  <g transform="translate(320, 180)">
    <path d="M0 60 Q20 20 40 0" stroke="#7CB342" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M10 65 Q35 25 55 5" stroke="#FDD835" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M-5 60 Q10 10 25 -10" stroke="#8BC34A" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M15 65 Q45 35 68 15" stroke="#C0CA33" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <path d="M-10 65 Q5 30 18 10" stroke="#9CCC65" stroke-width="4" stroke-linecap="round" fill="none"/>
  </g>
  <!-- Fruit / Supari offerings -->
  <circle cx="290" cy="265" r="16" fill="#FB8C00"/>
  <circle cx="320" cy="270" r="15" fill="#43A047"/>
  <circle cx="265" cy="270" r="12" fill="#8D6E63"/>
  <!-- Decorative text -->
  <text x="300" y="390" font-family="'Playfair Display', serif" font-size="22" fill="#880E4F" font-weight="700" text-anchor="middle">Blessings of Elders</text>
  <text x="300" y="415" font-family="'Caveat', cursive, sans-serif" font-size="18" fill="#AD1457" text-anchor="middle">Sacred Tika, Jamara &amp; Love</text>
</svg>